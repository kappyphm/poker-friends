services:
  postgres:
    image: postgres:16
    container_name: poker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    ports:
      - "5432:5432"
    volumes:
      - poker-pgdata:/var/lib/postgresql/data
volumes:
  poker-pgdata:
